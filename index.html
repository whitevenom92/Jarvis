<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speech to Text</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background-color: #1c2541;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #4ea8de;
      font-size: 1.8rem;
    }
    #text-output {
      width: 100%;
      height: 200px;
      background-color: #0b132b;
      color: #f1f1f1;
      border: 1px solid #3a506b;
      border-radius: 8px;
      padding: 15px;
      font-size: 1.1rem;
      resize: none;
      margin-bottom: 20px;
      outline: none;
    }
    .status {
      font-size: 0.95rem;
      margin-bottom: 20px;
      color: #5bc0be;
      min-height: 24px;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    #start-btn {
      background-color: #4ea8de;
      color: #0b132b;
    }
    #start-btn.listening {
      background-color: #ff4d4d;
      color: #ffffff;
    }
    #clear-btn, #copy-btn {
      background-color: #3a506b;
      color: #ffffff;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Speech to Text Converter</h1>
    <textarea id="text-output" placeholder="Your spoken text will appear here..." readonly></textarea>
    <div class="status" id="status">Click "Start Listening" and allow microphone access.</div>
    
    <div class="controls">
      <button id="start-btn">Start Listening</button>
      <button id="clear-btn">Clear Text</button>
      <button id="copy-btn">Copy Text</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');
    const output = document.getElementById('text-output');
    const status = document.getElementById('status');

    // Check for browser support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      status.textContent = "Speech Recognition API is not supported in this browser. Please use Google Chrome or Safari.";
      startBtn.disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;       // Keep listening until stopped
      recognition.interimResults = true;    // Show results in real-time as you speak
      recognition.lang = 'en-US';           // Set speech language

      let isListening = false;
      let finalTranscript = '';

      // Speech Recognition Events
      recognition.onstart = () => {
        isListening = true;
        startBtn.textContent = 'Stop Listening';
        startBtn.classList.add('listening');
        status.textContent = 'Listening... Speak into your microphone.';
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interimTranscript += transcript;
          }
        }

        output.value = finalTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        status.textContent = `Error: ${event.error}`;
      };

      recognition.onend = () => {
        isListening = false;
        startBtn.textContent = 'Start Listening';
        startBtn.classList.remove('listening');
        status.textContent = 'Stopped listening. Click to start again.';
      };

      // Button Listeners
      startBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });

      clearBtn.addEventListener('click', () => {
        finalTranscript = '';
        output.value = '';
        status.textContent = 'Cleared text.';
      });

      copyBtn.addEventListener('click', () => {
        if (output.value) {
          navigator.clipboard.writeText(output.value);
          status.textContent = 'Copied text to clipboard!';
        }
      });
    }
  </script>
</body>
</html>
