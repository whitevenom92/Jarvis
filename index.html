<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Voice AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050b14;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }
    .jarvis-title {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 0.5rem;
      text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
      display: flex;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .letter {
      display: inline-block;
      opacity: 0;
      transition: all 1s ease;
    }
    .letter.assemble {
      opacity: 1;
      transform: translate(0, 0);
    }
    
    .status-container {
      margin-top: 20px;
      text-align: center;
    }
    .status {
      font-size: 1rem;
      color: #00ff88;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-height: 24px;
    }
    
    .display-box {
      margin-top: 30px;
      width: 100%;
      max-width: 600px;
      background: rgba(11, 23, 42, 0.8);
      border: 1px solid #00f0ff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      text-align: center;
    }
    
    .user-text {
      font-size: 1.1rem;
      color: #88aaff;
      margin-bottom: 15px;
      min-height: 1.5rem;
    }
    
    .ai-text {
      font-size: 1.2rem;
      color: #ffffff;
      text-shadow: 0 0 8px #ffffff;
      min-height: 2rem;
      line-height: 1.5;
    }

    .mic-btn {
      margin-top: 20px;
      padding: 12px 28px;
      background: transparent;
      border: 2px solid #00f0ff;
      color: #00f0ff;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00f0ff;
      display: none;
    }
    .mic-btn:hover {
      background: #00f0ff;
      color: #050b14;
    }
  </style>
</head>
<body>

  <div class="jarvis-title" id="jarvisBtn">
    <span class="letter">J</span>
    <span class="letter">A</span>
    <span class="letter">R</span>
    <span class="letter">V</span>
    <span class="letter">I</span>
    <span class="letter">S</span>
  </div>

  <div class="status-container">
    <div class="status" id="status">Tap JARVIS to Start</div>
  </div>

  <div class="display-box">
    <div class="user-text" id="userSpeech">Anish: ---</div>
    <div class="ai-text" id="aiResponse">Tap title to initialize system...</div>
  </div>

  <button class="mic-btn" id="manualMicBtn">🎤 Tap to Speak Command</button>

  <script>
    // Assemble title animation
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.letter').forEach((el, index) => {
        setTimeout(() => el.classList.add('assemble'), index * 150);
      });
    });

    const jarvisBtn = document.getElementById('jarvisBtn');
    const statusText = document.getElementById('status');
    const userSpeechText = document.getElementById('userSpeech');
    const aiResponseText = document.getElementById('aiResponse');
    const manualMicBtn = document.getElementById('manualMicBtn');

    let recognition;
    let isInitialized = false;

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        statusText.textContent = "Listening for command...";
        statusText.style.color = "#00ff88";
      };

      recognition.onresult = async (event) => {
        const userQuery = event.results[0][0].transcript;
        userSpeechText.textContent = `Anish: "${userQuery}"`;
        statusText.textContent = "JARVIS is thinking...";
        statusText.style.color = "#00f0ff";

        // Query Cloud AI
        await fetchAIResponse(userQuery);
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          statusText.textContent = "Could not catch audio. Try again.";
        }
      };

      recognition.onend = () => {
        if (!window.speechSynthesis.speaking && isInitialized) {
          statusText.textContent = "Ready. Tap microphone or JARVIS to talk.";
        }
      };
    } else {
      statusText.textContent = "Speech recognition unsupported on this browser.";
    }

    // Text to Speech Function
    function speak(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Natural')));
        if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onend = () => {
          if (callback) callback();
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    // Call Cloud AI API
    async function fetchAIResponse(prompt) {
      aiResponseText.textContent = "Processing response...";
      
      try {
        const response = await fetch("https://api-inference.huggingface.co/models/Mistralai/Mistral-7B-Instruct-v0.2", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            inputs: `[INST] You are JARVIS, a smart AI assistant for Anish. Keep your answer concise (2-3 sentences max): ${prompt} [/INST]`
          })
        });

        const data = await response.json();

        if (Array.isArray(data) && data[0].generated_text) {
          const fullText = data[0].generated_text;
          const cleanAnswer = (fullText.split('[/INST]')[1] || fullText).trim();
          
          aiResponseText.textContent = cleanAnswer;
          statusText.textContent = "JARVIS Speaking...";
          
          // Speak AI response, then listen for next command
          speak(cleanAnswer, () => {
            listenForCommand();
          });
        } else {
          aiResponseText.textContent = "I experienced a brief offline delay. Please repeat your question.";
          speak("I experienced a brief offline delay. Please repeat your question.", () => {
            listenForCommand();
          });
        }
      } catch (err) {
        aiResponseText.textContent = "Unable to reach network intelligence servers.";
        statusText.textContent = "Connection Error";
      }
    }

    function listenForCommand() {
      if (recognition && isInitialized) {
        try {
          recognition.start();
        } catch (e) {
          // Restart if already running
        }
      }
    }

    // Initial activation trigger on tap
    jarvisBtn.addEventListener('click', () => {
      if (isInitialized) {
        listenForCommand();
        return;
      }

      isInitialized = true;
      manualMicBtn.style.display = "inline-block";
      const initialGreeting = "Hello Anish, I am your AI assistant. How can I help you?";
      
      userSpeechText.textContent = "System Initialized";
      aiResponseText.textContent = initialGreeting;
      statusText.textContent = "JARVIS Activating...";

      speak(initialGreeting, () => {
        listenForCommand();
      });
    });

    manualMicBtn.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      listenForCommand();
    });
  </script>
</body>
</html>
